<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drink Shop – Welcome</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f7f7f7;
      font-family: Arial, sans-serif;
    }
    .hero {
      height: 80vh;
      background: url('https://images.pexels.com/photos/1267320/pexels-photo-1267320.jpeg') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-shadow: 0 3px 10px rgba(0,0,0,0.5);
    }
    .hero h1 {
      font-size: 64px;
      font-weight: bold;
    }
    .btn-main {
      background: #ff8c00;
      border: none;
      padding: 12px 28px;
      font-size: 20px;
      border-radius: 8px;
    }
    .btn-main:hover {
      background: #e57a00;
    }
  </style>
</head>
<body>

  <div class="hero text-center">
    <div>
      <h1>Drink Shop</h1>
      <p class="lead">Fresh • Cool • Delicious</p>
      <a href="/products" class="btn btn-main">Xem Menu</a>
    </div>
  </div>

  <footer class="text-center mt-4 mb-2">
    <p>© 2025 Drink Shop – Crafted with ❤️</p>
  </footer>

</body>
</html>
